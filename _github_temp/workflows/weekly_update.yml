name: Weekly Real Price & Project Auto Update

on:
  schedule:
    # 台灣時間每週一清晨 04:00 (UTC 星期日 20:00) 自動執行
    - cron: '0 20 * * 0'
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊「Run workflow」隨時觸發更新

permissions:
  contents: write

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 簽出專案原始碼 (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ 設定 Node.js 執行環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 安裝依賴套件 (Install Dependencies)
        run: |
          npm install --production

      - name: 🚀 執行全自動更新管線 (Run Master Pipeline)
        run: |
          node scripts/run_pipeline.js

      - name: 💾 自動提交並發布至 GitHub Pages (Commit & Push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 檢查是否有檔案變動
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            CURRENT_DATE=$(TZ="Asia/Taipei" date +"%Y/%m/%d %H:%M")
            git commit -m "🤖 週期自動更新：宜蘭建案備查與實價登錄 ($CURRENT_DATE)"
            git push origin main
            echo "✓ 成功發布最新更新至 GitHub Pages！"
          else
            echo "ℹ️ 無新資料變動，跳過提交。"
          fi
