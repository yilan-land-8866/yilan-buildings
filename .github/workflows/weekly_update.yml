name: Real Price & Pre-sale Auto Update (Weekly + MOI Release Days)

on:
  schedule:
    # 1. 台灣時間每週一清晨 04:00 (UTC 星期日 20:00) 週期性全量更新
    - cron: '0 20 * * 0'
    # 2. 每月 1、11、21 日 內政部實價登錄上午發布後自動抓取 (台灣時間 10:30 / UTC 02:30)
    - cron: '30 2 1,11,21 * *'
    # 3. 每月 1、11、21 日 內政部實價登錄下午補正確認抓取 (台灣時間 15:30 / UTC 07:30)
    - cron: '30 7 1,11,21 * *'
  workflow_dispatch: # 支援在 GitHub Actions 網頁隨時手動點擊按鈕即時更新

permissions:
  contents: write

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 簽出專案原始碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ 設定 Node.js 執行環境
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 安裝依賴套件
        run: npm install --production

      - name: 🚀 執行全自動更新管線
        run: node scripts/run_pipeline.js

      - name: 💾 自動提交並發布至 GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            CURRENT_DATE=$(TZ="Asia/Taipei" date +"%Y/%m/%d %H:%M")
            git commit -m "🤖 自動更新：宜蘭建案備查與實價登錄 ($CURRENT_DATE)"
            git push origin main
            echo "✓ 成功發布最新更新至 GitHub Pages！"
          else
            echo "ℹ️ 無新資料變動，跳過提交。"
          fi
